# Home-level patch, applied to EVERY dsh profile (web, headless, ...) and — in
# the composition order bundles -> profile patch -> home patch -> --patch —
# AFTER each profile's own cordis.patch.yml. A `config` row here therefore
# outranks the profile layer, and the web Models settings page then refuses to
# write that entry ("... is overridden by a home patch or command-line
# overlay").
#
# The llm-pi-ai provider routes (ollama-local, supercompute) and the
# agent-default-model that used to live here were moved into each profile's own
# patch on 2026-10-01:
#   dsh-home/profiles/web/cordis.patch.yml
#   dsh-home/profiles/headless/cordis.patch.yml
# Nothing is configured at home level any more, so 设置 → 模型 can manage the
# model routes again.
#
# This file must stay a valid YAML sequence: a comments-only file fails boot
# (loadOptionalPatches), so the empty layer is written as `[]`.
[]
